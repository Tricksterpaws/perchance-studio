<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<title>Perchance Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#14121c; --panel:#1d1a28; --line:#2c2840; --text:#ece9f5; --dim:#8d88a3; --accent:#ffd98a; --nav:58px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif; overflow:hidden; }
  .view { position:absolute; inset:0 0 calc(var(--nav) + env(safe-area-inset-bottom)) 0; display:none; }
  .view.on { display:block; }
  .launch { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .launch .spark { font-size:64px; color:var(--accent); line-height:1; }
  .launch h1 { margin:12px 0 4px; font-size:24px; }
  .launch #genName { color:var(--dim); margin:0 0 28px; font-size:14px; word-break:break-all; }
  #openGen { background:var(--accent); color:#1b1622; border:0; border-radius:14px; padding:16px 36px; font:600 18px system-ui,sans-serif; }
  .launch .hint { color:var(--dim); font-size:14px; margin-top:28px; max-width:320px; }
  .launch .hint b { color:var(--text); }

  nav { position:absolute; left:0; right:0; bottom:0; height:calc(var(--nav) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom); display:flex; background:var(--panel); border-top:1px solid var(--line); }
  nav button { flex:1; background:none; border:0; color:var(--dim); font:inherit; font-size:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  nav button svg { width:22px; height:22px; }
  nav button.on { color:var(--accent); }

  #gallery { overflow-y:auto; padding:calc(env(safe-area-inset-top) + 12px) 10px 16px; }
  .bar { display:flex; align-items:center; gap:8px; margin:0 4px 12px; }
  .bar h1 { font-size:20px; margin:0; flex:1; }
  .bar button, .sheet button { background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; font:inherit; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:6px; }
  .grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; display:block; background:var(--panel); }
  .empty { color:var(--dim); text-align:center; padding:48px 24px; }
  .empty b { color:var(--text); }

  #viewer { position:fixed; inset:0; background:#000e; display:none; flex-direction:column; z-index:10; }
  #viewer.on { display:flex; }
  #viewer img { flex:1; min-height:0; object-fit:contain; width:100%; }
  .sheet { display:flex; gap:8px; padding:12px 12px calc(12px + env(safe-area-inset-bottom)); justify-content:center; }
  .sheet .danger { color:#ff9b9b; }
  #toast { position:fixed; left:50%; bottom:calc(var(--nav) + 20px); transform:translateX(-50%); background:var(--accent);
    color:#222; padding:8px 14px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
  #toast.on { opacity:1; }
</style>
</head>
<body>

<section id="prompt" class="view on">
  <div class="launch">
    <div class="spark">✦</div>
    <h1>Perchance Studio</h1>
    <p id="genName"></p>
    <button id="openGen">Open generator</button>
    <p class="hint">Opens on top of the app. Swipe back to return here.<br>
    To keep an image: long-press it → <b>Share image</b> → <b>Studio</b>.</p>
  </div>
</section>

<section id="gallery" class="view">
  <div class="bar">
    <h1>Gallery</h1>
    <button id="addBtn">Add</button>
    <button id="setBtn" aria-label="Settings">⚙</button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <b>No saved images yet.</b><br><br>
    In Prompt, long-press an image → <b>Share image</b> → <b>Studio</b>.<br>
    Or tap <b>Add</b> to pick images you've already downloaded.
  </div>
  <input id="file" type="file" accept="image/*" multiple hidden>
</section>

<div id="viewer">
  <img id="big" alt="">
  <div class="sheet">
    <button id="shareBtn">Share</button>
    <button id="saveBtn">Download</button>
    <button id="delBtn" class="danger">Delete</button>
    <button id="closeBtn">Close</button>
  </div>
</div>

<nav>
  <button data-view="prompt" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17l.7 1.6 1.6.7-1.6.7L19 22l-.7-1.6-1.6-.7 1.6-.7z"/></svg>
    Prompt
  </button>
  <button data-view="gallery">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Gallery
  </button>
</nav>

<div id="toast"></div>

<script src="db.js"></script>
<script>
const DEFAULT_GEN = 'https://perchance.org/ai-text-to-image-generator';
const $ = id => document.getElementById(id);
const genURL = () => localStorage.getItem('genURL') || DEFAULT_GEN;

// Perchance blocks being shown inside other sites, so the generator opens
// on top of the app (Android shows it as an in-app browser page).
function showGenName() { $('genName').textContent = genURL().replace(/^https:\/\//, ''); }
showGenName();
$('openGen').onclick = () => {
  const w = window.open(genURL(), '_blank');
  if (!w) location.href = genURL();
};

function show(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === view));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  if (view === 'gallery') renderGallery();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.view));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800);
}

// ---- Gallery ----
let urls = [], current = null;
async function renderGallery() {
  urls.forEach(URL.revokeObjectURL); urls = [];
  const items = await allImages();
  $('empty').hidden = items.length > 0;
  $('grid').replaceChildren(...items.map(it => {
    const img = document.createElement('img');
    const u = URL.createObjectURL(it.blob); urls.push(u);
    img.src = u; img.loading = 'lazy';
    img.onclick = () => openViewer(it, u);
    return img;
  }));
}

function openViewer(item, url) { current = item; $('big').src = url; $('viewer').classList.add('on'); }
$('closeBtn').onclick = () => $('viewer').classList.remove('on');

$('delBtn').onclick = async () => {
  if (!current || !confirm('Delete this image from the gallery?')) return;
  await deleteImage(current.id); $('viewer').classList.remove('on'); renderGallery();
};

$('saveBtn').onclick = () => {
  if (!current) return;
  const a = document.createElement('a');
  a.href = $('big').src;
  a.download = `perchance-${current.created}.${(current.blob.type.split('/')[1] || 'png')}`;
  a.click();
};

$('shareBtn').onclick = async () => {
  if (!current) return;
  const file = new File([current.blob], `perchance-${current.created}.png`, { type: current.blob.type || 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch {}
  } else toast('Sharing not supported here');
};

$('addBtn').onclick = () => $('file').click();
$('file').onchange = async e => {
  const files = [...e.target.files];
  for (const f of files) await addImage(f);
  e.target.value = ''; renderGallery(); toast(`Added ${files.length}`);
};

$('setBtn').onclick = () => {
  const next = prompt('Perchance generator URL', genURL());
  if (!next) return;
  if (!/^https:\/\/([a-z0-9-]+\.)*perchance\.org\//i.test(next)) { alert('Please use a perchance.org address.'); return; }
  localStorage.setItem('genURL', next.trim());
  showGenName(); toast('Generator updated');
};

// ---- Optional: images sent directly from a Perchance generator you own ----
// In your generator's HTML panel: window.parent.postMessage({type:'studio:save', src: imgUrlOrDataUrl, prompt}, '*')
window.addEventListener('message', async e => {
  let host = ''; try { host = new URL(e.origin).hostname; } catch {}
  if (!/(^|\.)perchance\.org$/.test(host)) return;
  const d = e.data;
  if (!d || d.type !== 'studio:save' || !d.src) return;
  try {
    const blob = await (await fetch(d.src)).blob();
    await addImage(blob, d.prompt || ''); toast('Saved to Gallery');
  } catch { toast('Could not save that image'); }
});

// ---- Startup ----
if (new URLSearchParams(location.search).get('view') === 'gallery') {
  show('gallery'); toast('Saved to Gallery');
  history.replaceState(null, '', './');
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
